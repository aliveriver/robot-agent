<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="data:,">
<title>轨迹管理器 - 天轶 2.0 Pro</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #1a1a2e; color: #eee; padding: 16px; }
h1 { text-align: center; margin-bottom: 16px; color: #00d4ff; font-size: 1.4em; }
.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; max-width: 1400px; margin: 0 auto; }
.panel { background: #16213e; border-radius: 8px; padding: 14px; border: 1px solid #0f3460; }
.panel h2 { font-size: 0.95em; color: #00d4ff; margin-bottom: 10px; border-bottom: 1px solid #0f3460; padding-bottom: 6px; }
.conn-status { text-align: center; margin-bottom: 12px; font-size: 0.85em; }
.conn-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
.conn-dot.on { background: #00ff88; }
.conn-dot.off { background: #ff4444; }
button { background: #0f3460; color: #eee; border: 1px solid #00d4ff; border-radius: 4px; padding: 6px 14px; cursor: pointer; font-size: 0.85em; transition: all 0.2s; }
button:hover { background: #00d4ff; color: #1a1a2e; }
button.active { background: #00d4ff; color: #1a1a2e; font-weight: bold; }
button.danger { border-color: #ff4444; }
button.danger:hover { background: #ff4444; }
button.record { border-color: #ff6b6b; }
button.record.active { background: #ff6b6b; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.6; } }
input, select { background: #0a1628; border: 1px solid #0f3460; color: #eee; border-radius: 4px; padding: 5px 8px; font-size: 0.85em; }
input:focus, select:focus { outline: none; border-color: #00d4ff; }
.joint-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; font-size: 0.8em; font-family: monospace; }
.joint-item { display: flex; align-items: center; padding: 2px 6px; background: #0a1628; border-radius: 3px; gap: 4px; }
.joint-label { color: #888; flex-shrink: 0; }
.joint-val { color: #00ff88; margin-left: auto; }
.joint-mode-btn { font-size: 0.7em; padding: 1px 5px; border-radius: 3px; cursor: pointer; border: 1px solid #444; background: #1a1a2e; color: #888; margin-left: 4px; flex-shrink: 0; }
.joint-mode-btn.limp { border-color: #ffaa00; color: #ffaa00; }
.joint-mode-btn.lock { border-color: #00ff88; color: #00ff88; }
.slider-row { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.slider-row label { width: 60px; font-size: 0.8em; color: #888; }
.slider-row input[type=range] { flex: 1; accent-color: #00d4ff; }
.slider-row .val { width: 36px; text-align: right; font-size: 0.8em; font-family: monospace; }
.mode-btns { display: flex; gap: 8px; margin-bottom: 10px; }
.current-group { margin-bottom: 8px; }
.current-group label { font-size: 0.8em; color: #888; display: block; margin-bottom: 3px; }
.traj-list { max-height: 260px; overflow-y: auto; }
.traj-item { display: flex; align-items: center; justify-content: space-between; padding: 8px; margin-bottom: 4px; background: #0a1628; border-radius: 4px; }
.traj-info { flex: 1; }
.traj-name { font-weight: bold; font-size: 0.9em; }
.traj-meta { font-size: 0.75em; color: #888; margin-top: 2px; }
.traj-actions { display: flex; gap: 4px; }
.traj-actions button { padding: 3px 8px; font-size: 0.75em; }
.record-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.record-bar input { width: 160px; }
.record-info { font-size: 0.8em; color: #ff6b6b; font-family: monospace; }
.progress-bar { width: 100%; height: 6px; background: #0a1628; border-radius: 3px; margin-top: 8px; overflow: hidden; }
.progress-fill { height: 100%; background: #00d4ff; transition: width 0.1s; }
.full-width { grid-column: 1 / -1; }
.body-ctrl { font-size: 0.85em; }
.body-row { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
.body-row .body-label { width: 100px; color: #888; font-size: 0.8em; }
.body-row button { padding: 3px 10px; }
.body-cur { font-family: monospace; color: #00ff88; font-size: 0.8em; margin-left: 6px; }
.play-opts { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.play-opts label { font-size: 0.78em; color: #888; }
.play-opts input { width: 56px; }
#urdfCanvas { width: 100%; height: 500px; display: block; background: #0a1628; border-radius: 4px; cursor: grab; }
#urdfCanvas:active { cursor: grabbing; }
#urdfStatus { font-size: 0.78em; color: #888; margin-top: 4px; }
</style>
</head>
<body>
<h1>轨迹管理器 - 天轶 2.0 Pro</h1>
<div class="conn-status"><span class="conn-dot off" id="connDot"></span><span id="connText">未连接</span></div>

<div class="grid">
<!-- 模式控制 + 电流调节 -->
<div class="panel">
    <h2>模式控制</h2>
    <div class="mode-btns">
        <button id="btnIdle" class="active" onclick="setMode('idle')">空闲</button>
        <button id="btnLimp" onclick="setMode('limp')">松弛 (拖动示教)</button>
        <button id="btnLock" onclick="setMode('lock')">锁定 (保持位置)</button>
    </div>
    <h2>电流调节</h2>
    <div class="current-group">
        <label>大关节电流 (肩/大臂) — <span id="bigCurVal">3.0</span>A</label>
        <div class="slider-row">
            <input type="range" min="0" max="6" step="0.1" value="3.0" id="bigCur" oninput="setCurrent('big','range')">
            <input type="number" min="0" max="6" step="0.1" value="3.0" id="bigCurNum" style="width:60px" onchange="setCurrent('big','num')">
        </div>
    </div>
    <div class="current-group">
        <label>小关节电流 (肘/腕) — <span id="smallCurVal">1.5</span>A</label>
        <div class="slider-row">
            <input type="range" min="0" max="4" step="0.1" value="1.5" id="smallCur" oninput="setCurrent('small','range')">
            <input type="number" min="0" max="4" step="0.1" value="1.5" id="smallCurNum" style="width:60px" onchange="setCurrent('small','num')">
        </div>
    </div>
</div>

<!-- 实时状态 -->
<div class="panel">
    <h2>关节状态 (实时)</h2>
    <div class="joint-grid" id="jointGrid"></div>
</div>

<!-- 灵巧手控制 -->
<div class="panel">
    <h2>左手控制</h2>
    <div style="margin-bottom:6px;display:flex;gap:6px;">
        <button onclick="handPreset('left','open')">张开</button>
        <button onclick="handPreset('left','close')">握紧</button>
    </div>
    <div id="leftHandSliders"></div>
    <h2 style="margin-top:10px">右手控制</h2>
    <div style="margin-bottom:6px;display:flex;gap:6px;">
        <button onclick="handPreset('right','open')">张开</button>
        <button onclick="handPreset('right','close')">握紧</button>
    </div>
    <div id="rightHandSliders"></div>
</div>

<!-- 腿部/腰部控制 -->
<div class="panel">
    <h2>腿部控制</h2>
    <div class="body-ctrl">
        <div class="body-row">
            <span class="body-label">电机52 (大腿)</span>
            <button onclick="bodyDelta('leg',52,-0.005)">-</button>
            <input type="number" step="0.005" id="leg52" style="width:80px" value="0" onchange="bodyPos('leg',52,this.value)">
            <button onclick="bodyDelta('leg',52,0.005)">+</button>
            <span class="body-cur" id="leg52cur">0.0000</span>
        </div>
        <div class="body-row">
            <span class="body-label">电机51 (小腿)</span>
            <button onclick="bodyDelta('leg',51,-0.005)">-</button>
            <input type="number" step="0.005" id="leg51" style="width:80px" value="0" onchange="bodyPos('leg',51,this.value)">
            <button onclick="bodyDelta('leg',51,0.005)">+</button>
            <span class="body-cur" id="leg51cur">0.0000</span>
        </div>
    </div>
    <h2 style="margin-top:10px">腰部控制</h2>
    <div class="body-ctrl">
        <div class="body-row">
            <span class="body-label">电机31 (腰偏航)</span>
            <button onclick="bodyDelta('waist',31,-0.005)">-</button>
            <input type="number" step="0.005" id="waist31" style="width:80px" value="0" onchange="bodyPos('waist',31,this.value)">
            <button onclick="bodyDelta('waist',31,0.005)">+</button>
            <span class="body-cur" id="waist31cur">0.0000</span>
        </div>
        <div class="body-row">
            <span class="body-label">电机32 (腰俯仰)</span>
            <button onclick="bodyDelta('waist',32,-0.005)">-</button>
            <input type="number" step="0.005" id="waist32" style="width:80px" value="0" onchange="bodyPos('waist',32,this.value)">
            <button onclick="bodyDelta('waist',32,0.005)">+</button>
            <span class="body-cur" id="waist32cur">0.0000</span>
        </div>
    </div>
    <h2 style="margin-top:10px">预设姿势</h2>
    <div style="display:flex;gap:8px;">
        <button onclick="bodyPreset('stand')">站立姿态 (Z)</button>
    </div>
</div>

<!-- 录制控制 -->
<div class="panel">
    <h2>轨迹录制</h2>
    <div class="record-bar">
        <input type="text" id="trajName" placeholder="轨迹名称">
        <select id="trajInterval" onchange="document.getElementById('trajIntervalNum').value=this.value">
            <option value="50">50ms</option>
            <option value="100" selected>100ms</option>
            <option value="200">200ms</option>
            <option value="500">500ms</option>
        </select>
        <input type="number" min="10" max="5000" step="10" value="100" id="trajIntervalNum" style="width:70px" placeholder="ms" onchange="syncIntervalSelect(this.value)">

        <button id="btnRecord" class="record" onclick="toggleRecord()">开始录制</button>
        <button id="btnStopPlay" onclick="stopPlayback()" style="display:none">停止回放</button>
    </div>
    <div class="record-info" id="recordInfo"></div>
    <div class="progress-bar" id="playBar" style="display:none"><div class="progress-fill" id="playFill"></div></div>
</div>

<!-- 轨迹管理 -->
<div class="panel full-width">
    <h2>已保存轨迹</h2>
    <div style="margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:0.85em;">
        <label style="color:#888">速度倍率:</label>
        <input type="number" id="playSpeed" min="0.1" max="5" step="0.1" value="1.0" style="width:60px">
        <label style="color:#888">重复次数 (0=无限):</label>
        <input type="number" id="playRepeat" min="0" max="999" step="1" value="1" style="width:60px">
        <label style="color:#888">循环间隔(秒):</label>
        <input type="number" id="playInterval" min="0" max="60" step="0.5" value="0" style="width:60px">
    </div>
    <div class="traj-list" id="trajList"><em style="color:#888">加载中...</em></div>
</div>

<!-- 机器人3D模型 -->
<div class="panel full-width" id="urdfPanel">
    <h2>机器人模型预览 (3D)</h2>
    <div style="position:relative;">
        <canvas id="urdfCanvas" style="width:100%;height:500px;display:block;border-radius:4px;background:#0a1628;"></canvas>
        <div id="urdfStatus" style="position:absolute;top:8px;left:8px;font-size:0.8em;color:#888;background:rgba(0,0,0,0.6);padding:4px 8px;border-radius:4px;">加载中...</div>
        <div style="position:absolute;top:8px;right:8px;display:flex;gap:6px;">
            <button onclick="resetCamera()" style="font-size:0.75em;padding:3px 8px;">重置视角</button>
        </div>
    </div>
    <div style="font-size:0.75em;color:#555;margin-top:6px;">左键旋转 · 右键平移 · 滚轮缩放。关节角度实时同步。</div>
</div>
</div>

<script>
// ── 全局状态 ──
let ws = null;
let connected = false;
let currentMode = 'idle';
let recording = false;
let playing = false;
let lastJointModes = {};

// ── WebSocket ──
function connect() {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    ws = new WebSocket(`${proto}//${location.host}/ws`);
    ws.onopen = () => { connected = true; updateConn(); };
    ws.onclose = () => { connected = false; updateConn(); setTimeout(connect, 2000); };
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'status') onStatus(msg.data);
        else if (msg.type === 'record_status') onRecordStatusMsg(msg);
        else if (msg.type === 'play_status') onPlayStatus(msg);
        else if (msg.type === 'result') onResult(msg);
    };
}

function send(action, params = {}) {
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ action, ...params }));
}

function updateConn() {
    document.getElementById('connDot').className = 'conn-dot ' + (connected ? 'on' : 'off');
    document.getElementById('connText').textContent = connected ? '已连接' : '未连接';
}

// ── 状态更新 ──
const jointLabels = ['肩俯仰','肩侧摆','肩旋转','肘弯曲','腕旋转','腕俯仰','腕偏转'];
const fingerLabels = ['小指','无名指','中指','食指','拇指弯','拇指旋'];

function onStatus(data) {
    currentMode = data.mode || 'idle';
    document.getElementById('btnIdle').className = currentMode === 'idle' ? 'active' : '';
    document.getElementById('btnLimp').className = currentMode === 'limp' ? 'active' : '';
    document.getElementById('btnLock').className = currentMode === 'lock' ? 'active' : '';

    const jm = data.joint_modes || {};
    lastJointModes = jm;

    const sides = [
        {ids: [11,12,13,14,15,16,17], arm: data.left_arm},
        {ids: [21,22,23,24,25,26,27], arm: data.right_arm},
    ];
    for (const side of sides) {
        for (let i = 0; i < 7; i++) {
            const mid = side.ids[i];
            const val = (side.arm[i] * 180 / Math.PI).toFixed(1);
            const mode = jm[String(mid)] || jm[mid] || 'idle';

            const valEl = document.getElementById(`jv_${mid}`);
            const limpBtn = document.getElementById(`jl_${mid}`);
            const lockBtn = document.getElementById(`jk_${mid}`);
            if (valEl) valEl.textContent = val + '°';
            if (limpBtn) limpBtn.className = 'joint-mode-btn' + (mode === 'limp' ? ' limp' : '');
            if (lockBtn) lockBtn.className = 'joint-mode-btn' + (mode === 'lock' ? ' lock' : '');
        }
    }

    updateBodyUI(data.body);
    updateUrdfJoints(data.left_arm || [], data.right_arm || []);
}

function initJointGrid() {
    const sides = [
        {prefix: '左', ids: [11,12,13,14,15,16,17]},
        {prefix: '右', ids: [21,22,23,24,25,26,27]},
    ];
    let html = '';
    for (const side of sides) {
        for (let i = 0; i < 7; i++) {
            const mid = side.ids[i];
            html += `<div class="joint-item">
                <span class="joint-label">${side.prefix}${jointLabels[i]}</span>
                <button class="joint-mode-btn" id="jl_${mid}" onclick="setJointMode(${mid},'limp')" title="松弛">松</button>
                <button class="joint-mode-btn" id="jk_${mid}" onclick="setJointMode(${mid},'lock')" title="锁定">锁</button>
                <span class="joint-val" id="jv_${mid}">0.0°</span>
            </div>`;
        }
    }
    document.getElementById('jointGrid').innerHTML = html;
}

function resetRecordUI() {
    recording = false;
    document.getElementById('recordInfo').textContent = '';
    document.getElementById('btnRecord').textContent = '开始录制';
    document.getElementById('btnRecord').className = 'record';
}

function onPlayStatus(msg) {
    const bar = document.getElementById('playBar');
    const fill = document.getElementById('playFill');
    const btnStop = document.getElementById('btnStopPlay');
    if (msg.playing) {
        playing = true;
        bar.style.display = 'block';
        if (btnStop) btnStop.style.display = 'inline-block';
        fill.style.width = (msg.progress * 100) + '%';
    } else {
        playing = false;
        fill.style.width = '100%';
        setTimeout(() => {
            bar.style.display = 'none';
            fill.style.width = '0%';
            if (btnStop) btnStop.style.display = 'none';
        }, 800);
    }
}

function resetPlayUI() {
    playing = false;
    document.getElementById('playBar').style.display = 'none';
    document.getElementById('playFill').style.width = '0%';
    const btnStop = document.getElementById('btnStopPlay');
    if (btnStop) btnStop.style.display = 'none';
}

function onRecordStatusMsg(msg) {
    if (msg.recording) {
        recording = true;
        document.getElementById('recordInfo').textContent = `录制中: ${msg.frames} 帧 | ${msg.elapsed_sec}s`;
        document.getElementById('btnRecord').textContent = '停止录制';
        document.getElementById('btnRecord').className = 'record active';
    } else {
        resetRecordUI();
    }
}

function onResult(msg) {
    if (msg.action === 'stop_record' && msg.ok) {
        resetRecordUI();
        loadTrajectories();
    }
    if (msg.action === 'play' && msg.ok) {
        document.getElementById('playBar').style.display = 'block';
        document.getElementById('playFill').style.width = '0%';
        const btnStop = document.getElementById('btnStopPlay');
        if (btnStop) btnStop.style.display = 'inline-block';
    }
    if (msg.action === 'stop_play') {
        resetPlayUI();
    }
}

// ── 模式控制 ──
function setMode(mode) { send('set_mode', { mode }); }

function setJointMode(mid, mode) {
    // Toggle: if already in this mode, set to idle
    const jm = lastJointModes || {};
    const current = jm[String(mid)] || jm[mid] || 'idle';
    const target = current === mode ? 'idle' : mode;
    send('set_joint_mode', { motor_ids: [mid], mode: target });
}

// ── 电流调节 ──
function setCurrent(type, source) {
    if (type === 'big') {
        let v;
        if (source === 'num') {
            v = document.getElementById('bigCurNum').value;
            document.getElementById('bigCur').value = v;
        } else {
            v = document.getElementById('bigCur').value;
            document.getElementById('bigCurNum').value = v;
        }
        document.getElementById('bigCurVal').textContent = v;
        send('set_current', { motor_ids: [11,12,21,22], current: parseFloat(v) });
    } else {
        let v;
        if (source === 'num') {
            v = document.getElementById('smallCurNum').value;
            document.getElementById('smallCur').value = v;
        } else {
            v = document.getElementById('smallCur').value;
            document.getElementById('smallCurNum').value = v;
        }
        document.getElementById('smallCurVal').textContent = v;
        send('set_current', { motor_ids: [13,14,15,16,17,23,24,25,26,27], current: parseFloat(v) });
    }
}

// ── 灵巧手 ──
function initHandSliders() {
    ['left', 'right'].forEach(side => {
        const container = document.getElementById(side === 'left' ? 'leftHandSliders' : 'rightHandSliders');
        let html = '';
        for (let i = 0; i < 6; i++) {
            html += `<div class="slider-row">
                <label>${fingerLabels[i]}</label>
                <input type="range" min="0" max="100" value="100" id="${side}F${i}" oninput="onHandSlider('${side}',${i},'range')">
                <input type="number" min="0" max="100" step="1" value="100" id="${side}F${i}N" style="width:50px" onchange="onHandSlider('${side}',${i},'num')">
            </div>`;
        }
        container.innerHTML = html;
    });
}

function onHandSlider(side, idx, source) {
    const rangeEl = document.getElementById(`${side}F${idx}`);
    const numEl = document.getElementById(`${side}F${idx}N`);
    if (source === 'num') {
        rangeEl.value = numEl.value;
    } else {
        numEl.value = rangeEl.value;
    }
    sendHand(side);
}

function sendHand(side) {
    const angles = [];
    for (let i = 0; i < 6; i++) {
        const v = parseInt(document.getElementById(`${side}F${i}`).value);
        angles.push(v);
    }
    send('set_hand', { side, angles });
}

function handPreset(side, preset) {
    const val = preset === 'open' ? 100 : 0;
    for (let i = 0; i < 6; i++) {
        document.getElementById(`${side}F${i}`).value = val;
        document.getElementById(`${side}F${i}N`).value = val;
    }
    send('set_hand', { side, angles: [val, val, val, val, val, val] });
}

// ── 腿部/腰部控制 ──
function bodyDelta(target, motorId, delta) {
    send('body_delta', { target, motor_id: motorId, delta });
}

function bodyPos(target, motorId, val) {
    send('body_pos', { target, motor_id: motorId, pos: parseFloat(val) });
}

function updateBodyUI(body) {
    if (!body) return;
    if (body.leg) {
        document.getElementById('leg51cur').textContent = body.leg['51'];
        document.getElementById('leg52cur').textContent = body.leg['52'];
    }
    if (body.waist) {
        document.getElementById('waist31cur').textContent = body.waist['31'];
        document.getElementById('waist32cur').textContent = body.waist['32'];
    }
    if (body.leg_target) {
        document.getElementById('leg51').value = body.leg_target['51'];
        document.getElementById('leg52').value = body.leg_target['52'];
    }
    if (body.waist_target) {
        document.getElementById('waist31').value = body.waist_target['31'];
        document.getElementById('waist32').value = body.waist_target['32'];
    }
}

// ── 录制 ──
function syncIntervalSelect(val) {
    const sel = document.getElementById('trajInterval');
    const opts = [...sel.options].map(o => o.value);
    sel.value = opts.includes(val) ? val : '';
}

function toggleRecord() {
    if (!recording) {
        const name = document.getElementById('trajName').value.trim();
        if (!name) { alert('请输入轨迹名称'); return; }
        const selectVal = document.getElementById('trajInterval').value;
        const numVal = document.getElementById('trajIntervalNum').value;
        const interval_ms = parseInt(selectVal || numVal || '100');
        if (interval_ms < 10) { alert('采样间隔不能小于10ms'); return; }
        send('start_record', { name, interval_ms });
    } else {
        send('stop_record');
    }
}

// ── 轨迹管理 ──
async function loadTrajectories() {
    try {
        const res = await fetch('/api/trajectories');
        const list = await res.json();
        const container = document.getElementById('trajList');
        if (!list.length) { container.innerHTML = '<em style="color:#888">暂无轨迹</em>'; return; }
        container.innerHTML = list.map(t => `
            <div class="traj-item">
                <div class="traj-info">
                    <div class="traj-name">${t.name}</div>
                    <div class="traj-meta">${t.total_frames}帧 | ${t.duration_sec.toFixed(1)}s | 间隔${t.sample_interval_ms}ms | ${t.created_at}</div>
                </div>
                <div class="traj-actions">
                    <button onclick="playTraj(${t.id})">回放</button>
                    <button onclick="renameTraj(${t.id},'${t.name}')">重命名</button>
                    <button class="danger" onclick="deleteTraj(${t.id})">删除</button>
                </div>
            </div>
        `).join('');
    } catch (e) {
        document.getElementById('trajList').innerHTML = '<em style="color:#ff4444">加载失败</em>';
    }
}

function playTraj(id) {
    const speed = parseFloat(document.getElementById('playSpeed').value || '1.0');
    const repeat = parseInt(document.getElementById('playRepeat').value || '1');
    const interval_sec = parseFloat(document.getElementById('playInterval').value || '0');
    send('play', { trajectory_id: id, speed, repeat, interval_sec });
}

function stopPlayback() {
    send('stop_play');
}

function bodyPreset(preset) {
    send('body_preset', { preset });
}

function renameTraj(id, oldName) {
    const name = prompt('新名称:', oldName);
    if (name && name !== oldName) {
        fetch(`/api/trajectories/${id}`, {
            method: 'PUT', headers: {'Content-Type':'application/json'},
            body: JSON.stringify({ name })
        }).then(() => loadTrajectories());
    }
}

function deleteTraj(id) {
    if (!confirm('确定删除此轨迹？')) return;
    fetch(`/api/trajectories/${id}`, { method: 'DELETE' }).then(() => loadTrajectories());
}

// ── 3D URDF 预览 ──
(function initUrdfViewer() {
    // 动态加载 Three.js
    const s1 = document.createElement('script');
    s1.src = 'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';
    s1.onload = () => {
        const s2 = document.createElement('script');
        s2.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js';
        s2.onload = () => {
            const s3 = document.createElement('script');
            s3.src = 'https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js';
            s3.onload = startUrdfViewer;
            document.head.appendChild(s3);
        };
        document.head.appendChild(s2);
    };
    document.head.appendChild(s1);
})();

let urdfScene, urdfCamera, urdfRenderer, urdfControls;
let urdfRobotGroup;
// URDF 关节 -> Three.js Object3D 映射
let jointObjects = {};
// 关节名 -> 关节定义（来自 URDF 解析）
let parsedJoints = {};
// 当前关节角度（rad）
let liveJointAngles = {};

// URDF 关节名 <-> 电机ID 映射
const MOTOR_JOINT_MAP = {
    11: 'shoulder_pitch_l_joint',
    12: 'shoulder_roll_l_joint',
    13: 'shoulder_yaw_l_joint',
    14: 'elbow_pitch_l_joint',
    15: 'elbow_yaw_l_joint',
    16: 'wrist_pitch_l_joint',
    17: 'wrist_yaw_l_joint',
    21: 'shoulder_pitch_r_joint',
    22: 'shoulder_roll_r_joint',
    23: 'shoulder_yaw_r_joint',
    24: 'elbow_pitch_r_joint',
    25: 'elbow_yaw_r_joint',
    26: 'wrist_pitch_r_joint',
    27: 'wrist_yaw_r_joint',
};

function startUrdfViewer() {
    const canvas = document.getElementById('urdfCanvas');
    if (!canvas) return;
    const statusEl = document.getElementById('urdfStatus');

    const THREE = window.THREE;

    // 场景
    urdfScene = new THREE.Scene();
    urdfScene.background = new THREE.Color(0x0a1628);
    urdfScene.add(new THREE.AmbientLight(0xffffff, 0.6));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
    dirLight.position.set(1, 2, 3);
    urdfScene.add(dirLight);
    const dirLight2 = new THREE.DirectionalLight(0x8888ff, 0.3);
    dirLight2.position.set(-2, -1, -1);
    urdfScene.add(dirLight2);

    // 网格
    const grid = new THREE.GridHelper(2, 20, 0x1a3a5c, 0x1a3a5c);
    urdfScene.add(grid);

    // 相机
    urdfCamera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.001, 100);
    urdfCamera.position.set(1.5, 1.0, 1.5);
    urdfCamera.lookAt(0, 0.5, 0);

    // 渲染器
    urdfRenderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    urdfRenderer.setPixelRatio(window.devicePixelRatio);
    urdfRenderer.setSize(canvas.clientWidth, canvas.clientHeight);

    // 轨道控制
    urdfControls = new THREE.OrbitControls(urdfCamera, canvas);
    urdfControls.target.set(0, 0.5, 0);
    urdfControls.update();

    // 响应容器大小变化
    const resizeObserver = new ResizeObserver(() => {
        const w = canvas.clientWidth, h = canvas.clientHeight;
        urdfCamera.aspect = w / h;
        urdfCamera.updateProjectionMatrix();
        urdfRenderer.setSize(w, h);
    });
    resizeObserver.observe(canvas.parentElement);

    // 渲染循环
    function animate() {
        requestAnimationFrame(animate);
        urdfControls.update();
        urdfRenderer.render(urdfScene, urdfCamera);
    }
    animate();

    // 加载 URDF + STL
    loadUrdfModel(statusEl);
}

function resetCamera() {
    if (!urdfCamera || !urdfControls) return;
    urdfCamera.position.set(1.5, 1.0, 1.5);
    urdfControls.target.set(0, 0.5, 0);
    urdfControls.update();
}

async function loadUrdfModel(statusEl) {
    const THREE = window.THREE;
    try {
        statusEl.textContent = '加载 URDF...';
        const resp = await fetch('/urdf/urdf/tianyi2.0_urdf_with_hands.urdf');
        if (!resp.ok) { statusEl.textContent = 'URDF 加载失败 ' + resp.status; return; }
        const urdfText = await resp.text();

        // 解析 URDF
        const parser = new DOMParser();
        const xmlDoc = parser.parseFromString(urdfText, 'text/xml');

        // 收集 link -> visual mesh filename
        const linkMeshes = {};
        xmlDoc.querySelectorAll('link').forEach(link => {
            const name = link.getAttribute('name');
            const meshEl = link.querySelector('visual geometry mesh');
            if (meshEl) {
                let fn = meshEl.getAttribute('filename') || '';
                // package://tianyi2_urdf/meshes/xxx.STL -> /urdf/meshes/xxx.STL
                fn = fn.replace(/^package:\/\/tianyi2_urdf\/meshes\//, '/urdf/meshes/');
                linkMeshes[name] = fn;
            }
        });

        // 收集关节定义
        parsedJoints = {};
        xmlDoc.querySelectorAll('joint').forEach(j => {
            const name = j.getAttribute('name');
            const type = j.getAttribute('type');
            const parent = j.querySelector('parent')?.getAttribute('link');
            const child = j.querySelector('child')?.getAttribute('link');
            const originEl = j.querySelector('origin');
            const axisEl = j.querySelector('axis');
            const xyz = (originEl?.getAttribute('xyz') || '0 0 0').split(' ').map(Number);
            const rpy = (originEl?.getAttribute('rpy') || '0 0 0').split(' ').map(Number);
            const axis = (axisEl?.getAttribute('xyz') || '0 0 1').split(' ').map(Number);
            parsedJoints[name] = { name, type, parent, child, xyz, rpy, axis };
        });

        // 建立 link 树
        const linkChildren = {}; // parent link -> [{joint, child link}]
        Object.values(parsedJoints).forEach(j => {
            if (!linkChildren[j.parent]) linkChildren[j.parent] = [];
            linkChildren[j.parent].push(j);
        });

        // 加载所有 STL 并返回 BufferGeometry
        const stlLoader = new THREE.STLLoader();
        const loadStl = (url) => new Promise((res) => {
            stlLoader.load(url, geo => res(geo), undefined, () => res(null));
        });

        // 材质
        const robotMat = new THREE.MeshPhongMaterial({
            color: 0xc0c0c0, specular: 0x444444, shininess: 60,
        });

        // 递归构建场景树
        statusEl.textContent = 'STL 加载中...';
        const linkObjects = {}; // link name -> THREE.Group

        async function buildLink(linkName, parentObj) {
            const group = new THREE.Group();
            group.name = 'link_' + linkName;
            parentObj.add(group);
            linkObjects[linkName] = group;

            const meshUrl = linkMeshes[linkName];
            if (meshUrl) {
                const geo = await loadStl(meshUrl);
                if (geo) {
                    geo.computeVertexNormals();
                    const mesh = new THREE.Mesh(geo, robotMat.clone());
                    group.add(mesh);
                }
            }

            // 子关节
            const children = linkChildren[linkName] || [];
            for (const joint of children) {
                // 创建关节 group（用于旋转）
                const jointGroup = new THREE.Group();
                jointGroup.name = 'joint_' + joint.name;

                // 设置关节在父坐标系中的位置和初始姿态（rpy）
                jointGroup.position.set(...joint.xyz);
                // RPY -> Three.js Euler (顺序 XYZ)
                jointGroup.rotation.set(joint.rpy[0], joint.rpy[1], joint.rpy[2]);

                group.add(jointGroup);
                jointObjects[joint.name] = { group: jointGroup, axis: joint.axis, type: joint.type };

                await buildLink(joint.child, jointGroup);
            }
        }

        // 找到 root link (无 parent 的 link)
        const allChildren = new Set(Object.values(parsedJoints).map(j => j.child));
        const allLinks = new Set(xmlDoc.querySelectorAll('link').keys ?
            [...xmlDoc.querySelectorAll('link')].map(l => l.getAttribute('name')) : []);
        let rootLink = 'base';
        xmlDoc.querySelectorAll('link').forEach(l => {
            const n = l.getAttribute('name');
            if (!allChildren.has(n)) rootLink = n;
        });

        urdfRobotGroup = new THREE.Group();
        urdfRobotGroup.name = 'robot';
        // 旋转使 Z 朝上（URDF 惯例），Three.js 默认 Y 朝上
        urdfRobotGroup.rotation.x = -Math.PI / 2;
        // 缩放：URDF 单位是 m，Three.js 也是 m，但模型可能很大
        urdfScene.add(urdfRobotGroup);

        await buildLink(rootLink, urdfRobotGroup);

        // 计算 bounding box 并自动调整相机
        const box = new THREE.Box3().setFromObject(urdfRobotGroup);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());
        const maxDim = Math.max(size.x, size.y, size.z);
        urdfCamera.position.set(center.x + maxDim * 1.5, center.y + maxDim * 0.8, center.z + maxDim * 1.5);
        urdfControls.target.copy(center);
        urdfControls.update();

        statusEl.textContent = `模型就绪 | ${Object.keys(linkMeshes).length} 个连杆`;
    } catch (e) {
        if (statusEl) statusEl.textContent = '加载出错: ' + e.message;
        console.error('URDF viewer error:', e);
    }
}

// 更新 URDF 关节角度（从 WebSocket status 调用）
function updateUrdfJoints(leftArm, rightArm) {
    if (!jointObjects || !Object.keys(jointObjects).length) return;
    const THREE = window.THREE;
    if (!THREE) return;

    const motorAngles = {};
    [11,12,13,14,15,16,17].forEach((mid, i) => motorAngles[mid] = leftArm[i]);
    [21,22,23,24,25,26,27].forEach((mid, i) => motorAngles[mid] = rightArm[i]);

    for (const [midStr, jointName] of Object.entries(MOTOR_JOINT_MAP)) {
        const mid = parseInt(midStr);
        const angle = motorAngles[mid];
        if (angle === undefined) continue;
        const jo = jointObjects[jointName];
        if (!jo || jo.type === 'fixed') continue;

        const ax = jo.axis;
        // 应用旋转：沿关节轴旋转 angle 弧度
        const axVec = new THREE.Vector3(...ax).normalize();
        const q = new THREE.Quaternion().setFromAxisAngle(axVec, angle);
        // 保留关节初始姿态，只叠加关节角
        jo.group.quaternion.copy(q);
    }
}
